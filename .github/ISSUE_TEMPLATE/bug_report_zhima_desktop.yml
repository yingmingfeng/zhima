name: "🐛 芝麻桌面端 Bug 报告"
description: "提交芝麻桌面端应用的问题"
title: "[Bug]: "
type: Bug
labels: ["Desktop", "Bug"]
body:
- type: input
  attributes:
    label: 版本号
    description: "请填写你使用的芝麻桌面端版本。"
    placeholder: "例如 v0.2.0"
  validations:
    required: true
- type: dropdown
  attributes:
    label: 模型
    description: "选择出现问题时使用的视觉语言模型。"
    options:
      - UI-TARS-1.5-7B
      - Doubao-1.5-UI-TARS
      - UI-TARS-2B-SFT
      - UI-TARS-7B-SFT
      - UI-TARS-7B-DPO
      - UI-TARS-72B-SFT
      - UI-TARS-72B-DPO
  validations:
    required: true
- type: dropdown
  attributes:
    label: 部署方式
    description: "选择模型的部署方式。"
    options:
      - 云端 (Cloud)
      - 本地 (Local)
  validations:
    required: true
- type: textarea
  attributes:
    label: 问题描述
    description: |
      请详细描述问题，包括预期行为、实际行为，以及相关截图（如有）。
    placeholder: |
      示例：
      - 预期行为：...
      - 实际行为：...
      - 截图：<附链接或嵌入图片>
  validations:
    required: true
- type: textarea
  attributes:
    label: 错误日志
    description: "请提供相关日志（可通过 帮助 -> 打开日志文件 获取）。"
    placeholder: "在此粘贴日志。"
  validations:
    required: false
