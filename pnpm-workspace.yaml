packages:
  - 'apps/*'
  - 'apps/agent-tars/src/*'
  - 'apps/ui-tars/src/*'
  - 'packages/dsh'
  - 'packages/ui-tars/**'
  - '!packages/agent-infra/**'
  - 'packages/common/*'
  - '!packages/ui-tars/visualizer'
  - '!packages/ui-tars/operators/browser-operator'
  - '!packages/ui-tars/operators/browserbase'
  # zhima 内置插件（advanced shell 窗口增强），dev 走 workspace link、prod 随 app 分发
  - 'packages/dsh-plugins/*'

# pnpm 11：专属配置全部迁移到这里（.npmrc 只认认证和 registry）
shamefullyHoist: true
nodeLinker: hoisted
minimumReleaseAge: 0
blockExoticSubdeps: false
# pnpm 11 默认 verifyDepsBeforeRun=install：每次 pnpm run 前自动检查依赖，判定需
# 更新就自动跑 install，连带执行 workspace 包的 prepare（重新 build @agent-infra/*，
# browser 的 rslib build 在 Windows 上还会 OOM 崩溃）。关闭后 run 不再自动 install，
# 依赖有更新时手动执行 pnpm install。
verifyDepsBeforeRun: false
publicHoistPattern:
  - '@deepseek-ai/*'
allowBuilds:
  '@computer-use/mac-screen-capture-permissions': true
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  '@parcel/watcher': true
  bufferutil: true
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  msw: false
  node-pty: true
  protobufjs: true
  puppeteer: true
  secp256k1: true
  sharp: true
  utf-8-validate: true

# 统一 sharp 版本，避免 dsh（0.35.3）与应用（0.33.3）两版都带 libvips-42.dll，
# 在 Windows 上 DLL 同名冲突导致 dsh-attachment-local 加载失败。
overrides:
  sharp: 0.33.3
  tsx: ^4.23.0
