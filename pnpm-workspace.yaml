packages:
  - 'apps/*'
  - 'apps/agent-tars/src/*'
  - 'apps/zhima/src/*'
  - 'packages/dsh'
  - 'packages/ui-tars/**'
  - '!packages/agent-infra/**'
  - 'packages/common/*'
  - '!packages/ui-tars/visualizer'
  - '!packages/ui-tars/operators/browser-operator'
  - '!packages/ui-tars/operators/browserbase'
  # zhima 内置插件容器（packages/dsh-overlay）与各内置插件子包（分 base-overlay 后端 / web-overlay UI 两层）。
  # dev 走 workspace link、prod 随 app 分发。apps 仅依赖容器 @zhima/dsh-overlay。
  - 'packages/dsh-overlay'
  - 'packages/dsh-overlay/*'
  - 'packages/dsh-overlay/*/*'

# pnpm 11：专属配置全部迁移到这里（.npmrc 只认认证和 registry）
shamefullyHoist: true
nodeLinker: hoisted
minimumReleaseAge: 0
blockExoticSubdeps: false
# pnpm 11 默认 verifyDepsBeforeRun=install：每次 pnpm run 前自动检查依赖，判定需
# 更新就自动跑 install，连带执行 workspace 包的 prepare（重新 build @agent-infra/*，
# browser 的 rslib build 在 Windows 上还会 OOM 崩溃）。关闭后 run 不再自动 install，
# 依赖有更新时手动执行 pnpm install。
verifyDepsBeforeRun: false
publicHoistPattern:
  - '@deepseek-ai/*'
  # 内置插件子包提升到依赖树顶层，主进程 linkInnerPlugins / module-resolution 才能按裸包名解析
  - '@dsh-overlay/*'
allowBuilds:
  '@computer-use/mac-screen-capture-permissions': true
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  '@parcel/watcher': true
  bufferutil: true
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  msw: false
  node-pty: true
  protobufjs: true
  puppeteer: true
  secp256k1: true
  sharp: true
  utf-8-validate: true

# 统一 sharp 版本，避免 dsh（0.35.3）与应用（0.33.3）两版都带 libvips-42.dll，
# 在 Windows 上 DLL 同名冲突导致 dsh-attachment-local 加载失败。
# 统一 @electron-forge/shared-types 与 builder-util-runtime，避免 workspace 内
# 各装两份不同版本导致 forge.config.ts / electron-updater 类型不兼容（TS2345）。
overrides:
  sharp: 0.33.3
  tsx: ^4.23.0
  '@electron-forge/shared-types': 7.8.0
  builder-util-runtime: 9.7.0
  # 统一 commander 到 DSH 运行时声明的版本（@deepseek-ai/dsh-web-app、dsh、dsh-headless 均 ^15）。
  # 否则 @electron/asar（构建期工具，仅 CLI 用 commander@5）会占住 apps/zhima/node_modules 顶槽
  # commander@5，导致打包时 @deepseek-ai/* 解析到 5.1.0（无 addHelpText）而报错，dev 却解析仓库
  # 根 commander@15。override 让 dev 与打包的解析一致；DSH 升 commander 大版本时改这一行即可。
  commander: ^15.0.0
  # 同类问题：js-yaml 在 apps 顶槽被 electron-updater 的 ^4.1.0 占到 4.1.0，而 DSH 运行时（仓库根）用
  # 4.3.1。electron-updater 的 ^4.1.0 兼容 4.3.x，override 到 root 一致版本安全，对齐 dev/打包解析。
  js-yaml: ^4.3.1
