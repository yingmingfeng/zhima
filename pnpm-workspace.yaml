packages:
  - 'apps/*'
  - 'apps/agent-tars/src/*'
  - 'apps/ui-tars/src/*'
  - 'packages/dsh'
  - 'packages/ui-tars/**'
  - 'packages/agent-infra/**'
  - '!packages/agent-infra/create-new-mcp/template-*'
  - 'packages/common/*'
  - '!packages/ui-tars/visualizer'

# pnpm 11：专属配置全部迁移到这里（.npmrc 只认认证和 registry）
shamefullyHoist: true
nodeLinker: hoisted
minimumReleaseAge: 0
blockExoticSubdeps: false
publicHoistPattern:
  - '@deepseek-ai/*'
allowBuilds:
  '@computer-use/mac-screen-capture-permissions': true
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  '@parcel/watcher': true
  bufferutil: true
  core-js: false
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  msw: false
  node-pty: true
  protobufjs: true
  puppeteer: true
  secp256k1: true
  sharp: true
  utf-8-validate: true
