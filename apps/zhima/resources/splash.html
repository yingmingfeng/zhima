<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>芝麻</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      /* 透明无边框窗口内的圆角卡片：固定尺寸居中，四周留透明边（露出桌面），
         而不是铺满窗口，否则透明窗口会被填成深色块 */
      .card {
        position: fixed;
        width: 280px;
        height: 196px;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        border-radius: 18px;
        background: #ffffff;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.18);
        color: #1f2329;
        user-select: none;
      }
      .logo {
        width: 64px;
        height: 64px;
      }
      .name {
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 2px;
        color: #1f2329;
      }
      .bar {
        width: 120px;
        height: 4px;
        border-radius: 2px;
        background: rgba(31, 35, 41, 0.12);
        overflow: hidden;
      }
      .fill {
        height: 100%;
        width: 40%;
        border-radius: 2px;
        background: linear-gradient(90deg, #4f8cff, #8b5cf6);
        animation: slide 1.1s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      }
      .hint {
        font-size: 11px;
        color: #8a8f99;
        letter-spacing: 1px;
      }
      @keyframes slide {
        0% {
          transform: translateX(-120px);
        }
        100% {
          transform: translateX(120px);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="logo" src="icon.png" alt="芝麻" />
      <div class="name">芝麻</div>
      <div class="bar"><div class="fill"></div></div>
      <div class="hint">正在启动 DSH 引擎…</div>
    </div>
  </body>
</html>
